<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>사천성 배틀</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><span class="eyebrow">TILE-LINK DUEL</span><h1 data-i18n="title">사천성 배틀</h1></div>
      <div class="timer" id="timer" aria-live="polite">03:00</div>
      <div class="top-actions"><button id="language-button" class="quiet">EN</button><a class="quiet button-link" href="/" data-i18n="portal">게임 선택</a></div>
    </header>

    <section id="waiting-view" class="overlay-card" aria-live="polite">
      <span class="seal">川</span><h2 data-i18n="waiting">상대를 기다리는 중</h2>
      <p data-i18n="waitingDetail">같은 배치에서 먼저 타일을 연결하세요.</p>
      <div class="waiting-players" id="waiting-players"></div>
      <button id="ready-button" class="primary" data-i18n="ready">준비</button>
      <button id="ai-battle-button" class="ai-battle" data-i18n="aiBattle">AI 대전</button>
      <p class="ai-help" data-i18n="aiNormal">AI는 보통 난이도로 플레이합니다</p>
    </section>

    <section id="game-view" class="game-layout hidden">
      <section class="board-column">
        <div class="board-heading"><div><span data-i18n="myBoard">내 보드</span> · <strong id="my-name">?</strong></div><b><span id="my-score">0</span> / 48</b></div>
        <div id="board-frame" class="board-frame">
          <div id="board" class="tile-board" role="grid" data-i18n-aria-label="myBoardLabel" aria-label="내 사천성 타일 보드"></div>
          <svg id="path-layer" class="path-layer" viewBox="0 0 12 8" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div id="shuffle-warning-badge" class="shuffle-warning-badge hidden" role="status" aria-live="assertive"><span aria-hidden="true">⟳</span> <b data-i18n="autoShuffleWarning">막힘 자동 셔플</b></div>
          <div id="countdown" class="countdown hidden"></div>
        </div>
        <p id="board-feedback" class="board-feedback" role="status" aria-live="polite" data-i18n="selectFirst">연결할 첫 타일을 선택하세요.</p>
      </section>

      <aside class="status-panel item-panel">
        <span class="panel-label" data-i18n="items">아이템</span>
        <p data-i18n="itemHelp">클릭하거나 1·2·3 키로 사용</p>
        <div id="inventory" class="inventory" aria-label="아이템 슬롯"></div>
        <div id="my-effects" class="effect-list" aria-live="polite"></div>
        <div class="legend"><span>↪<b data-i18n="ruleTurns">최대 2회 꺾임</b></span><span>□<b data-i18n="ruleOutside">바깥 연결 허용</b></span></div>
      </aside>

      <aside class="status-panel opponent-panel" aria-labelledby="opponent-board-title">
        <span class="panel-label" id="opponent-board-title" data-i18n="opponentBoard">상대 보드</span><strong><span id="opponent-name">?</span> <span id="opponent-ai-badge" class="ai-badge hidden" data-i18n="aiBadge">AI</span></strong>
        <div id="opponent-board-frame" class="opponent-board-frame">
          <div id="opponent-board" class="tile-board opponent-board" role="img" data-i18n-aria-label="opponentBoardLabel" aria-label="상대 사천성 진행 보드"></div>
        </div>
        <div class="progress-track"><i id="opponent-progress"></i></div>
        <b><span id="opponent-score">0</span> / 48</b>
        <div id="opponent-effects" class="effect-list" aria-live="polite"></div>
      </aside>
    </section>

    <section id="result-view" class="overlay-card hidden" aria-live="assertive">
      <span class="seal">勝</span><h2 id="result-title">승리</h2><p id="result-detail"></p>
      <div class="result-actions"><button id="rematch-button" class="primary" data-i18n="rematch">재대결</button><a href="/" class="quiet button-link" data-i18n="portal">게임 선택</a></div>
    </section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
