<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>미니게임 천국</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ── 로비 화면 (단일 뷰: 인원 정보 + 게임 카드 그리드) ──── -->
  <div class="lobby-view view" id="lobby-view">
    <header class="hero">
      <h1 class="hero-title">미니게임 천국</h1>
      <p class="hero-sub">친구랑 한 판 — LAN 1:1</p>
    </header>

    <div class="lobby-meta">
      <div class="player-count" id="player-count">1/2</div>
      <div class="player-role" id="player-role">호스트</div>
      <p class="lobby-hint" id="lobby-hint">친구가 접속하면 종목을 선택하세요</p>
      <!-- 게스트 대기 안내 (호스트에게는 hidden) -->
      <p class="guest-waiting" id="guest-waiting" hidden>호스트가 종목을 선택 중...</p>
      <p class="lobby-status" id="lobby-status"></p>
    </div>

    <!-- 게임 카드 그리드 (항상 표시, 인원/역할에 따라 CSS로 비활성) -->
    <main class="container">
      <section id="game-grid" class="game-grid" aria-label="게임 목록">
        <!-- app.js가 games.json을 fetch하여 카드 동적 생성 -->
      </section>
    </main>
  </div>

  <footer class="site-footer">
    <p>게임 서버가 모두 실행 중이어야 접속이 가능합니다 · 친구는 호스트 IP로 접속하세요</p>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
