<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>미니게임 천국</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ── 닉네임 입장 게이트 (로비 진입 전 최초 표시) ────────── -->
  <div class="nickname-gate-view view" id="nickname-gate">
    <!-- 배경 게임 이모지 장식 (낮은 opacity, 클릭 투과) -->
    <div class="game-bg-hint" aria-hidden="true">&#x1F3B2; &#x265F;&#xFE0F; &#x1F0CF; &#x1F004; &#x1F3AF; &#x1F3AE; &#x1F3B4; &#x1F3B3; &#x26AB; &#x1F0CF; &#x1F3AE; &#x1F3B2; &#x265F;&#xFE0F; &#x1F004; &#x1F3AF; &#x1F3B4; &#x1F3B3; &#x26AB; &#x1F0CF; &#x1F3B2; &#x1F3B4; &#x1F3AF; &#x1F3AE; &#x265F;&#xFE0F; &#x1F004; &#x1F3B2; &#x1F0CF; &#x1F3B3; &#x26AB; &#x1F3AE; &#x1F004; &#x1F3B3; &#x1F3B2; &#x1F3AF; &#x265F;&#xFE0F; &#x1F3B4; &#x26AB; &#x1F0CF; &#x1F3AE; &#x1F3B2; &#x265F;&#xFE0F; &#x1F3AE; &#x1F004; &#x1F3B4; &#x1F3B2; &#x1F3AF; &#x1F0CF; &#x1F3B3; &#x26AB; &#x1F3B2; &#x1F3B3; &#x1F3B2; &#x1F3AE; &#x1F004; &#x265F;&#xFE0F; &#x1F3AF; &#x1F3B4; &#x26AB; &#x1F0CF; &#x1F3B2;</div>
    <div class="nickname-card">
      <h2 class="nickname-title">미니게임 천국</h2>
      <p class="nickname-sub">닉네임을 입력하고 입장하세요</p>
      <input id="nickname-input" type="text" maxlength="12"
             placeholder="닉네임 (최대 12자)" autocomplete="off" />
      <button id="btn-enter-lobby" type="button">입장하기</button>
      <p class="nickname-error" id="nickname-error"></p>
    </div>
  </div>

  <!-- ── 로비 화면 (단일 뷰: 인원 정보 + 게임 카드 그리드) ──── -->
  <div class="lobby-view view hidden" id="lobby-view">
    <header class="hero">
      <h1 class="hero-title">미니게임 천국</h1>
      <p class="hero-sub">친구랑 한 판 — LAN 1:1</p>
    </header>

    <div class="lobby-meta">
      <div class="player-count" id="player-count">1/2</div>
      <div class="player-role" id="player-role">호스트</div>
      <!-- 접속자 목록 (이름 + 🟢) — LOBBY_STATE.players로 실시간 갱신 -->
      <div id="presence-list" class="presence-list"></div>
      <!-- 호스트 전용 인원 선택 UI (게스트에게는 app.js가 hidden 처리) -->
      <div id="player-count-selector" class="player-count-selector" hidden>
        <span class="pcs-label">목표 인원</span>
        <button class="pcs-btn active" data-target="2" type="button">2인</button>
        <button class="pcs-btn" data-target="3" type="button">3인</button>
        <button class="pcs-btn" data-target="4" type="button">4인</button>
        <button class="pcs-btn" data-target="5" type="button">5인</button>
      </div>
      <!-- AI 채우기 컨트롤 (호스트 전용, 3인 이상 목표에서만 활성) -->
      <div id="ai-fill-controls" class="ai-fill-controls" hidden>
        <button id="btn-fill-ai" type="button" class="ai-fill-btn">&#x1F916; AI로 채우기</button>
        <button id="btn-cancel-ai" type="button" class="ai-fill-cancel-btn" hidden>AI 취소</button>
        <span id="ai-fill-hint" class="ai-fill-hint"></span>
      </div>
      <p class="lobby-hint" id="lobby-hint">친구가 접속하면 종목을 선택하세요</p>
      <!-- 게스트 대기 안내 (호스트에게는 hidden) -->
      <p class="guest-waiting" id="guest-waiting" hidden>호스트가 종목을 고르면 자동으로 게임방으로 이동돼요 &#x1F3AE;</p>
      <p class="lobby-status" id="lobby-status"></p>
    </div>

    <!-- 게임 카드 그리드 (항상 표시, 인원/역할에 따라 CSS로 비활성) -->
    <main class="container">
      <section id="game-grid" class="game-grid" aria-label="게임 목록">
        <!-- app.js가 games.json을 fetch하여 카드 동적 생성 -->
      </section>
    </main>
  </div>

  <footer class="site-footer">
    <p>게임 서버가 모두 실행 중이어야 접속이 가능합니다 · 친구는 호스트 IP로 접속하세요</p>
  </footer>

  <!-- 입장/퇴장 토스트 컨테이너 (2.5초 자동 소멸) -->
  <div id="lobby-toast" class="lobby-toast" role="status" aria-live="polite"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
