<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>미니게임 천국</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ── 로비 화면 (초기 표시) ─────────────────────────── -->
  <div class="lobby-view view" id="lobby-view">
    <header class="hero">
      <h1 class="hero-title">미니게임 천국</h1>
      <p class="hero-sub">친구랑 한 판 — LAN 1:1</p>
    </header>

    <div class="lobby-body">
      <div class="player-count" id="player-count">1/2</div>
      <div class="player-role" id="player-role">호스트</div>
      <p class="lobby-hint" id="lobby-hint">혼자 시작하면 AI 대전으로 진행됩니다</p>
      <button class="start-btn" id="start-btn" type="button">스타트</button>
      <p class="guest-waiting" id="guest-waiting" hidden>호스트가 시작하길 기다리는 중...</p>
      <p class="lobby-status" id="lobby-status"></p>
    </div>
  </div>

  <!-- ── 종목 선택 화면 (초기 숨김) ────────────────────── -->
  <div class="game-select-view view hidden" id="game-select-view">
    <header class="game-select-header">
      <h2 class="game-select-title">종목 선택</h2>
      <span class="mode-badge" id="mode-badge">AI 대전</span>
    </header>
    <main class="container">
      <p class="host-pick-hint" id="host-pick-hint" hidden>카드를 선택하세요</p>
      <p class="guest-pick-hint" id="guest-pick-hint" hidden>호스트가 선택 중...</p>
      <section id="game-grid" class="game-grid" aria-label="게임 목록">
        <!-- app.js가 games.json을 fetch하여 카드 동적 생성 -->
      </section>
    </main>
  </div>

  <footer class="site-footer">
    <p>게임 서버가 모두 실행 중이어야 접속이 가능합니다 · 친구는 호스트 IP로 접속하세요</p>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
