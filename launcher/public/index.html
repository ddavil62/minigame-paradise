<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>미니게임 천국</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ── 닉네임 입장 게이트 (로비 진입 전 최초 표시) ────────── -->
  <div class="nickname-gate-view view" id="nickname-gate">
    <!-- 배경 게임 이모지 장식 (낮은 opacity, 클릭 투과) -->
    <div class="game-bg-hint" aria-hidden="true">&#x1F3B2; &#x265F;&#xFE0F; &#x1F0CF; &#x1F004; &#x1F3AF; &#x1F3AE; &#x1F3B4; &#x1F3B3; &#x26AB; &#x1F0CF; &#x1F3AE; &#x1F3B2; &#x265F;&#xFE0F; &#x1F004; &#x1F3AF; &#x1F3B4; &#x1F3B3; &#x26AB; &#x1F0CF; &#x1F3B2; &#x1F3B4; &#x1F3AF; &#x1F3AE; &#x265F;&#xFE0F; &#x1F004; &#x1F3B2; &#x1F0CF; &#x1F3B3; &#x26AB; &#x1F3AE; &#x1F004; &#x1F3B3; &#x1F3B2; &#x1F3AF; &#x265F;&#xFE0F; &#x1F3B4; &#x26AB; &#x1F0CF; &#x1F3AE; &#x1F3B2; &#x265F;&#xFE0F; &#x1F3AE; &#x1F004; &#x1F3B4; &#x1F3B2; &#x1F3AF; &#x1F0CF; &#x1F3B3; &#x26AB; &#x1F3B2; &#x1F3B3; &#x1F3B2; &#x1F3AE; &#x1F004; &#x265F;&#xFE0F; &#x1F3AF; &#x1F3B4; &#x26AB; &#x1F0CF; &#x1F3B2;</div>
    <div class="nickname-card">
      <h2 class="nickname-title">미니게임 천국</h2>
      <p class="nickname-sub">닉네임을 입력하고 입장하세요</p>
      <input id="nickname-input" type="text" maxlength="12"
             placeholder="닉네임 (최대 12자)" autocomplete="off" />
      <button id="btn-enter-lobby" type="button">입장하기</button>
      <p class="nickname-error" id="nickname-error"></p>
    </div>
  </div>

  <!-- ── 포탈 뷰 (닉네임 인사말 + 게임 카드 그리드, WS 연결 없음) ──── -->
  <div class="view hidden" id="portal-view">
    <header class="hero">
      <h1 class="hero-title">미니게임 천국</h1>
      <p class="hero-sub">친구랑 한 판 — LAN 파티</p>
    </header>

    <div class="portal-meta">
      <span id="portal-player-name"></span>
    </div>

    <!-- 게임 카드 그리드 -->
    <main class="container">
      <section id="game-grid" class="game-grid" aria-label="게임 목록">
        <!-- app.js가 games.json을 fetch하여 카드 동적 생성 -->
      </section>
    </main>
  </div>

  <!-- ── 대기실 뷰 (게임별 독립 WS 연결) ──── -->
  <div class="view hidden" id="waiting-room-view">
    <div class="waiting-room-header">
      <h2 id="wr-game-name">게임 이름</h2>
      <button id="btn-leave-room" type="button">나가기</button>
    </div>
    <div class="waiting-room-players" id="wr-players">
      <!-- ROOM_STATE로 동적 렌더 -->
    </div>
    <div class="waiting-room-actions">
      <button id="btn-ready" type="button">준비</button>
      <button id="btn-wr-fill-ai" type="button" hidden>AI로 채우기</button>
    </div>
    <div class="waiting-room-status" id="wr-status" role="status" aria-live="polite"></div>
    <div id="wr-toast" class="lobby-toast" role="status" aria-live="polite"></div>
  </div>

  <footer class="site-footer">
    <p>게임 서버가 모두 실행 중이어야 접속이 가능합니다 · 친구는 호스트 IP로 접속하세요</p>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
