<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 96" aria-hidden="true">
  <!-- 외곽 카드 배경 -->
  <rect x="8" y="4" width="144" height="88" rx="12" fill="#1A1F3A" stroke="#F5E9C9" stroke-width="2"/>

  <!-- 배경 글자 텍스처 (작은 원으로 별 노이즈 표현) -->
  <circle cx="24" cy="16" r="1" fill="#F5E9C9" fill-opacity="0.15"/>
  <circle cx="108" cy="14" r="1" fill="#F5E9C9" fill-opacity="0.18"/>
  <circle cx="30" cy="80" r="1" fill="#F5E9C9" fill-opacity="0.12"/>
  <circle cx="130" cy="78" r="1.2" fill="#F5E9C9" fill-opacity="0.16"/>

  <!-- P1 말풍선 (보라) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="25" y="39" width="38" height="26" rx="6" fill="#252A48" stroke="#A855F7" stroke-width="2"/>
    <!-- 말풍선 꼬리 (닫힌 삼각형, rect 하단 선이 상단 변을 자연 덮음) -->
    <path d="M37 65 L40 72 L43 65 Z" fill="#252A48" stroke="#A855F7" stroke-width="2"/>
    <!-- P1 글자 -->
    <text x="44" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#C084FC" font-family="sans-serif">말</text>
  </g>

  <!-- P2 말풍선 (자홍) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="97" y="39" width="38" height="26" rx="6" fill="#252A48" stroke="#EC4899" stroke-width="2"/>
    <!-- 말풍선 꼬리 (닫힌 삼각형, rect 하단 선이 상단 변을 자연 덮음) -->
    <path d="M117 65 L120 72 L123 65 Z" fill="#252A48" stroke="#EC4899" stroke-width="2"/>
    <!-- P2 글자 -->
    <text x="116" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#F5E9C9" font-family="sans-serif">잇</text>
  </g>

  <!-- 중앙 충돌 에너지 (골드 스파크) -->
  <path d="M76 48 L78 44 L80 50 L82 42 L84 48" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M74 54 L77 52 L75 56 M86 54 L83 52 L85 56" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="80" cy="46" r="1.5" fill="#F59E0B"/>

  <!-- 가비지 음절 -->
  <text x="80" y="38" text-anchor="middle" font-size="10" font-weight="bold" fill="#F59E0B" stroke="#111827" stroke-width="1" font-family="sans-serif" transform="rotate(-15,80,38)">뀨</text>
</svg>
